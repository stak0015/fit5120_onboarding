[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wiseage-mortality-api"
version = "1.0.0"
description = "FastAPI service for population-level Malaysian mortality insights"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.117,<1",
  "groq>=0.31,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sihatq*"]
exclude = ["alembic*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
